name: Mutation

# Line coverage says a table's row ran; a surviving mutant says nothing checked
# what it did, which is the failure mode a table-driven design invites — and
# `drift` and `export` are tables. See CLAUDE.md.
#
# On a schedule rather than on every pull request. A run re-executes the suite
# against each mutant, which is about as long as a native build, and unlike the
# native build it is not answering a question about the commit in front of it:
# the score moves when test quality moves, which is a slower thing than a
# branch. Run it on demand before merging something that adds a table row —
# `workflow_dispatch` above, or locally:
#
#   ./mvnw test-compile pitest:mutationCoverage
on:
  workflow_dispatch:
  schedule:
  - cron: "13 4 7 * *"
permissions: {}

jobs:
  mutation:
    name: Mutation coverage
    # SKIP_GRAALVM_NATIVE_IMAGE_BUILD keeps the graal profile from firing and
    # building an image this job would throw away.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      env:
        # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)
        MISE_VERSION: 2026.11.1
      with:
        cache: false
        version: ${{ env.MISE_VERSION }}
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ runner.os }}-${{ runner.arch }}-maven-${{ hashFiles('**/pom.xml') }}
        path: ~/.m2/repository
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-maven-
    - name: Run mutation testing
      env:
        SKIP_GRAALVM_NATIVE_IMAGE_BUILD: true
      run: |
        set -o xtrace
        ./mvnw \
          --batch-mode \
          -Dsha1="${GITHUB_SHA}" \
          test-compile \
          pitest:mutationCoverage
    # Uploaded on failure too: the score alone does not say which mutant
    # survived, and the HTML report is what names the line.
    - if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: mutation-report
        path: target/pit-reports
    - name: Make sure build did not change anything
      run: git diff --exit-code
