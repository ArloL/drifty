name: SonarCloud

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  schedule:
  - cron: "17 9 24 * *"
permissions: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJSON(github) }}
      run: echo "$GITHUB_CONTEXT"
    - name: Dump job context
      env:
        JOB_CONTEXT: ${{ toJSON(job) }}
      run: echo "$JOB_CONTEXT"
    - name: Dump steps context
      env:
        STEPS_CONTEXT: ${{ toJSON(steps) }}
      run: echo "$STEPS_CONTEXT"
    - name: Dump runner context
      env:
        RUNNER_CONTEXT: ${{ toJSON(runner) }}
      run: echo "$RUNNER_CONTEXT"
    - name: Dump strategy context
      env:
        STRATEGY_CONTEXT: ${{ toJSON(strategy) }}
      run: echo "$STRATEGY_CONTEXT"
    - name: Dump matrix context
      env:
        MATRIX_CONTEXT: ${{ toJSON(matrix) }}
      run: echo "$MATRIX_CONTEXT"
    - name: Dump environment variables
      run: set
  analyze:
    name: Analyze
    # Dependency bumps don't need an analysis, and Dependabot pull requests
    # can't read SONAR_TOKEN from the sonarcloud environment anyway. Keyed on
    # the author because github.actor turns human on a rebase or re-run, and a
    # branch name is something any collaborator can forge
    if: >-
      github.event_name != 'pull_request'
      || (
        github.event.pull_request.user.login != 'dependabot[bot]'
        && github.event.pull_request.user.login != 'renovate[bot]'
      )
    runs-on: ubuntu-latest
    environment: sonarcloud
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Sonar needs the full history to attribute new code to authors
        fetch-depth: 0
        persist-credentials: false
    - # .tool-versions names graalvm-community, and setup-java takes the
      # distribution from there rather than from the input below
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        cache: maven
        distribution: graalvm
        java-version-file: .tool-versions
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ runner.os }}-sonar
        path: ~/.sonar/cache
        restore-keys: ${{ runner.os }}-sonar
    - name: Build and analyze
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        set -o xtrace
        # Sonar only needs the JVM tests JaCoCo instruments, so skip the
        # native image build: 20s instead of 9min, same coverage report
        # Wait for the quality gate so a failure fails this workflow's own
        # required status check, which also reports on the bumps we skip
        ./mvnw \
          --batch-mode \
          -Dsha1="${GITHUB_SHA}" \
          -P '!graal' \
          -Dsonar.qualitygate.wait=true \
          verify \
          sonar:sonar
    - name: Make sure build did not change anything
      run: git diff --exit-code
  required-status-check:
    name: sonarcloud.required-status-check
    needs:
    - analyze
    # GitHub Actions skips this job when any of the dependents fail. And skips
    # are considered success in their weird logic. So we always run it and fail
    # ourselves if necessary
    if: always()
    runs-on: ubuntu-latest
    steps:
    - run: echo "Use this job as the required status check of this workflow"
    - name: Check that all jobs were successful
      env:
        RESULTS: ${{ toJSON(needs) }}
      # analyze has no needs, so "skipped" can only mean its own if was
      # false: a dependency bump pull request it deliberately opted out of
      run: |
        echo "$RESULTS" | jq --exit-status \
          'all(.result == "success" or .result == "skipped")' || exit 1
