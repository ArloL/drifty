name: Main

on:
  push:
  pull_request:
    branches:
    - main
    types:
    - reopened
  schedule:
  - cron: "24 16 25 * *"
permissions: {}
env:
  ARTIFACT: drifty

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJSON(github) }}
      run: echo "$GITHUB_CONTEXT"
    - name: Dump job context
      env:
        JOB_CONTEXT: ${{ toJSON(job) }}
      run: echo "$JOB_CONTEXT"
    - name: Dump steps context
      env:
        STEPS_CONTEXT: ${{ toJSON(steps) }}
      run: echo "$STEPS_CONTEXT"
    - name: Dump runner context
      env:
        RUNNER_CONTEXT: ${{ toJSON(runner) }}
      run: echo "$RUNNER_CONTEXT"
    - name: Dump strategy context
      env:
        STRATEGY_CONTEXT: ${{ toJSON(strategy) }}
      run: echo "$STRATEGY_CONTEXT"
    - name: Dump matrix context
      env:
        MATRIX_CONTEXT: ${{ toJSON(matrix) }}
      run: echo "$MATRIX_CONTEXT"
    - name: Dump environment variables
      run: set
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.output.outputs.new_version }}
      build_timestamp: ${{ steps.output.outputs.build_timestamp }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: true
    - name: Bump version and push tag
      id: tag
      if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      uses: ArloL/calver-tag-action@3f0c5cbd7acfa52ddeef19ae080b540c03d231f7 # v2608.0.107
    - id: output
      env:
        NEW_VERSION: ${{ steps.tag.outputs.new_version }}
      run: |
        echo "new_version=${NEW_VERSION:-$GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
        echo "build_timestamp=$(date --iso-8601=seconds)" >> "${GITHUB_OUTPUT}"
    - name: Make sure build did not change anything
      run: git diff --exit-code
  macos:
    needs: version
    runs-on: macos-latest
    env:
      REVISION: ${{ needs.version.outputs.new_version }}
      BUILD_TIMESTAMP: ${{ needs.version.outputs.build_timestamp }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        cache: maven
        distribution: graalvm
        java-version-file: .tool-versions
    - name: Build with Maven
      run: |
        set -o xtrace
        ./mvnw \
          --batch-mode \
          -Dsha1="${GITHUB_SHA}" \
          -Drevision="${REVISION}" \
          verify
    - name: Move artifacts
      run: |
        mkdir target/artifacts
        cp target/"${ARTIFACT}"-* target/artifacts
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ env.ARTIFACT }}-${{ github.job }}-${{ needs.version.outputs.new_version }}
        path: target/artifacts
    - name: Make sure build did not change anything
      run: git diff --exit-code
  linux:
    needs: version
    runs-on: ubuntu-latest
    env:
      REVISION: ${{ needs.version.outputs.new_version }}
      BUILD_TIMESTAMP: ${{ needs.version.outputs.build_timestamp }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        cache: maven
        distribution: graalvm
        java-version-file: .tool-versions
    - name: Build with Maven
      run: |
        set -o xtrace
        ./mvnw \
          --batch-mode \
          -Dsha1="${GITHUB_SHA}" \
          -Drevision="${REVISION}" \
          verify
    - name: Move artifacts
      run: |
        mkdir target/artifacts
        cp target/"${ARTIFACT}"-* target/artifacts
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ env.ARTIFACT }}-${{ github.job }}-${{ needs.version.outputs.new_version }}
        path: target/artifacts
    - name: Make sure build did not change anything
      run: git diff --exit-code
  linux-arm:
    needs: version
    runs-on: ubuntu-24.04-arm
    env:
      REVISION: ${{ needs.version.outputs.new_version }}
      BUILD_TIMESTAMP: ${{ needs.version.outputs.build_timestamp }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        cache: maven
        distribution: graalvm
        java-version-file: .tool-versions
    - name: Build with Maven
      run: |
        set -o xtrace
        ./mvnw \
          --batch-mode \
          -Dsha1="${GITHUB_SHA}" \
          -Drevision="${REVISION}" \
          verify
    - name: Move artifacts
      run: |
        mkdir target/artifacts
        cp target/"${ARTIFACT}"-* target/artifacts
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ env.ARTIFACT }}-${{ github.job }}-${{ needs.version.outputs.new_version }}
        path: target/artifacts
    - name: Make sure build did not change anything
      run: git diff --exit-code
  windows:
    needs: version
    runs-on: windows-latest
    env:
      REVISION: ${{ needs.version.outputs.new_version }}
      BUILD_TIMESTAMP: ${{ needs.version.outputs.build_timestamp }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        cache: maven
        distribution: graalvm
        java-version-file: .tool-versions
    - name: Build with Maven
      run: |
        .\mvnw --batch-mode -Dsha1="$env:GITHUB_SHA" -Drevision="$env:REVISION" verify
    - name: Move artifacts
      run: |
        mkdir target/artifacts
        copy target/$env:ARTIFACT-* target/artifacts
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ env.ARTIFACT }}-${{ github.job }}-${{ needs.version.outputs.new_version }}
        path: target/artifacts
    - name: Make sure build did not change anything
      run: git diff --exit-code
  pkl-format:
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=github-releases depName=apple/pkl
      PKL_VERSION: 0.32.1
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # --proto/--proto-redir pin both the request and the release asset's
    # redirect to https: a GitHub release download always redirects, and
    # --location alone would follow one to plain http.
    - name: Install pkl
      run: |
        curl --proto "=https" --proto-redir "=https" \
          --location --fail --silent --show-error \
          --output "${RUNNER_TEMP}/pkl" \
          "https://github.com/apple/pkl/releases/download/${PKL_VERSION}/pkl-linux-amd64"
        chmod +x "${RUNNER_TEMP}/pkl"
    # Every tracked Pkl file, not a directory: the exported config an adopter
    # commits is expected to be `pkl format` output (see SPEC.md), so the
    # schema and the example it is diffed against are held to the same shape.
    - name: Check that every Pkl file is formatted
      run: |
        git ls-files -z '*.pkl' \
          | xargs -0 --no-run-if-empty "${RUNNER_TEMP}/pkl" format --diff-name-only \
          || {
            echo "::error::The files above are not formatted. Fix with: git ls-files -z '*.pkl' | xargs -0 pkl format -w"
            exit 1
          }
  release:
    needs:
    - version
    - macos
    - linux
    - linux-arm
    - windows
    if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Download all workflow run artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: ./target
    # mise and every other binary installer picks a release asset by the os and
    # arch tokens in its name and then runs the file inside under the name that
    # file already has, so each archive holds exactly one executable called
    # drifty. An asset naming only the os is what made `mise use
    # github:ArloL/drifty` install an arch it had not checked, or a zip of jars
    # with no `drifty` in it at all.
    - name: Prepare artifacts
      working-directory: target
      env:
        NEW_VERSION: ${{ needs.version.outputs.new_version }}
      run: |
        mkdir artifacts staging
        while read -r job os arch; do
          cp "${ARTIFACT}-${job}-${NEW_VERSION}/${ARTIFACT}-${os}-${NEW_VERSION}" "staging/${ARTIFACT}"
          chmod +x "staging/${ARTIFACT}"
          tar --create --gzip \
            --file "artifacts/${ARTIFACT}-${os}-${arch}.tar.gz" \
            --directory staging "${ARTIFACT}"
          rm "staging/${ARTIFACT}"
        done <<'PLATFORMS'
        linux linux x64
        linux-arm linux arm64
        macos macos arm64
        PLATFORMS
        cp "${ARTIFACT}-windows-${NEW_VERSION}/${ARTIFACT}-windows-${NEW_VERSION}.exe" "staging/${ARTIFACT}.exe"
        (cd staging && zip "../artifacts/${ARTIFACT}-windows-x64.zip" "${ARTIFACT}.exe")
        # Every job builds the same jars; publish one copy, named without an os
        # token so no installer scores it as a platform build.
        zip --junk-paths "artifacts/${ARTIFACT}-${NEW_VERSION}-jars.zip" \
          "${ARTIFACT}-linux-${NEW_VERSION}"/*.jar
    # mise verifies these when `github_attestations` is on, and cannot be told
    # to trust an asset it cannot verify, so attest before the release exists.
    - name: Attest the release assets
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: target/artifacts/*
    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NEW_VERSION: ${{ needs.version.outputs.new_version }}
      run: |
        gh release create "v${NEW_VERSION}" \
          --title "Release ${NEW_VERSION}" \
          ./target/artifacts/*
    - name: Make sure build did not change anything
      run: git diff --exit-code
  deploy:
    needs:
    - version
    - macos
    - linux
    - windows
    if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/dependabot/') }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # Temurin because this job only publishes jars: the graal profile
    # activates on a JAVA_HOME that has a native-image, so on GraalVM this
    # deploy built one and threw it away.
    - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        cache: maven
        distribution: temurin
        # renovate: datasource=java-version depName=java
        java-version: 25.0.4
    - name: Publish to GitHub Packages Apache Maven
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REVISION: ${{ needs.version.outputs.new_version }}
        BUILD_TIMESTAMP: ${{ needs.version.outputs.build_timestamp }}
      run: |
        ./mvnw \
          --batch-mode \
          -Dsha1="${GITHUB_SHA}" \
          -Drevision="${REVISION}" \
          -DaltDeploymentRepository="github::https://maven.pkg.github.com/${GITHUB_REPOSITORY}" \
          deploy
    - name: Make sure build did not change anything
      run: git diff --exit-code
  required-status-check:
    name: main.required-status-check
    needs:
    - macos
    - linux
    - linux-arm
    - windows
    - pkl-format
    # GitHub Actions skips this job when any of the dependents fail. And skips
    # are considered success in their weird logic. So we always run it and fail
    # ourselves if necessary
    if: always()
    runs-on: ubuntu-latest
    steps:
    - run: echo "Use this job as the required status check of this workflow"
    - name: Check that all jobs were successful
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        echo "$RESULTS" | jq --exit-status 'all(.result == "success")' || exit 1
