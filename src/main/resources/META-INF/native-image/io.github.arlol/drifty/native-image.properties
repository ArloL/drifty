# AddAllCharsets: native-image bundles a minimal charset set, so
# Charset.forName fails for the platform encoding on Windows (Cp1252). JNA
# reads native.encoding in its static initializer and, when the lookup fails,
# warns and falls back to a different charset for every Java<->native string.
#
# No IncludeAllLocales: it registered ~49,000 locale-data classes for
# reflection, which was a third of the image (45MB), 2GB of the builder's peak
# memory, and what had the test image build thrashing on the 7GB macOS runner:
# a third of its 20 minutes there went to GC. The
# tool formats nothing locale-sensitively; a non-English runtime locale falls
# back to the root data.
Args = \
-H:+ReportExceptionStackTraces \
--no-fallback \
--enable-url-protocols=https \
-H:+AddAllCharsets
